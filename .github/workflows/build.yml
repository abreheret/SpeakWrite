# Builds SpeakWrite on Windows, Linux and macOS.
# - Every push and pull request: build + unit tests, binaries kept as workflow artifacts.
# - A tag "v*" (git tag v0.1.0 && git push origin v0.1.0): same, then a GitHub Release
#   with the binaries attached.
name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # CPU builds: CUDA needs the toolkit and a target GPU generation, see INSTALL.md.
          - name: windows-x64
            os: windows-latest
            features: ""
            exe: speakwrite.exe
          # Oldest supported Ubuntu runner, for a binary that runs on older glibc versions.
          - name: linux-x64
            os: ubuntu-22.04
            features: ""
            exe: speakwrite
          - name: macos-arm64
            os: macos-latest
            features: metal
            exe: speakwrite
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        run: cargo build --locked --release -p speakwrite ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      # Unit tests only: none of them downloads a model.
      - name: Test
        shell: bash
        run: cargo test --locked --release -p speakwrite ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Package
        shell: bash
        run: |
          dir="speakwrite-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/release/${{ matrix.exe }}" README.md README.fr.md INSTALL.md INSTALL.fr.md LICENSE "$dir/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$dir.zip" "$dir"
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: speakwrite-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
