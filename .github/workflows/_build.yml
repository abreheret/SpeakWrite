# Reusable job: builds, tests and packages SpeakWrite for one platform.
# Called by build-windows.yml, build-linux.yml, build-macos.yml and release.yml.
name: Build (reusable)

on:
  workflow_call:
    inputs:
      name:
        description: Platform name, used in the archive name
        required: true
        type: string
      os:
        description: GitHub runner
        required: true
        type: string
      features:
        description: Cargo features
        required: false
        type: string
        default: ""
      exe:
        description: Executable file name
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ inputs.name }}
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        run: cargo build --locked --release -p speakwrite ${{ inputs.features && format('--features {0}', inputs.features) || '' }}

      # Unit tests only: none of them downloads a model.
      - name: Test
        shell: bash
        run: cargo test --locked --release -p speakwrite ${{ inputs.features && format('--features {0}', inputs.features) || '' }}

      - name: Package
        shell: bash
        run: |
          dir="speakwrite-${{ inputs.name }}"
          mkdir "$dir"
          cp "target/release/${{ inputs.exe }}" README.md README.fr.md INSTALL.md INSTALL.fr.md LICENSE "$dir/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$dir.zip" "$dir"
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: speakwrite-${{ inputs.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
