# Reusable job: builds, tests and packages SpeakWrite for one platform.
# Called by build-windows.yml, build-linux.yml, build-macos.yml and release.yml.
name: Build (reusable)

on:
  workflow_call:
    inputs:
      name:
        description: Platform name, used in the archive name
        required: true
        type: string
      os:
        description: GitHub runner
        required: true
        type: string
      features:
        description: Cargo features
        required: false
        type: string
        default: ""
      exe:
        description: Executable file name
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ inputs.name }}
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev libxdo-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        run: cargo build --locked --release -p speakwrite ${{ inputs.features && format('--features {0}', inputs.features) || '' }}

      # Unit tests only: none of them downloads a model.
      - name: Test
        shell: bash
        run: cargo test --locked --release -p speakwrite ${{ inputs.features && format('--features {0}', inputs.features) || '' }}

      # Archive of the executable and the docs, usable without installing.
      - name: Package
        shell: bash
        run: |
          dir="speakwrite-${{ inputs.name }}"
          mkdir -p dist "$dir"
          cp "target/release/${{ inputs.exe }}" README.md README.fr.md INSTALL.md INSTALL.fr.md LICENSE "$dir/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "dist/$dir.zip" "$dir"
          else
            tar czf "dist/$dir.tar.gz" "$dir"
          fi

      # Per-user MSI installer: packaging/windows/speakwrite.wxs.
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $version = (cargo pkgid -p speakwrite) -replace '.*@', ''
          wix build packaging\windows\speakwrite.wxs -arch x64 -d "Version=$version" -d "RepoDir=$env:GITHUB_WORKSPACE" -o "dist\speakwrite-${{ inputs.name }}.msi"
          # Debug symbols of the installer: not for the release.
          Remove-Item "dist\*.wixpdb"

      # SpeakWrite.app in a disk image: scripts/package-macos.sh.
      - name: macOS disk image
        if: runner.os == 'macOS'
        run: ./scripts/package-macos.sh "dist/speakwrite-${{ inputs.name }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: speakwrite-${{ inputs.name }}
          path: dist/
          if-no-files-found: error
