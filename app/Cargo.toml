[package]
name = "speakwrite"
description = "Read the selected text aloud and dictate, with local Kyutai models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# GPU for dictation (Kyutai STT). Without them, the model runs on the CPU.
cuda = ["moshi/cuda", "candle/cuda", "candle-nn/cuda"]
metal = ["moshi/metal", "candle/metal", "candle-nn/metal"]

[dependencies]
anyhow = "1"
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
candle = { package = "candle-core", version = "0.9.1" }
candle-nn = "0.9.1"
crossbeam-channel = "0.5"
directories = "6"
enigo = "0.6"
flate2 = "1"
global-hotkey = "0.9"
hf-hub = "0.4"
moshi = "0.6.1"
mp3lame-encoder = "0.3"
rfd = "0.17"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
sentencepiece = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
symphonia = { version = "0.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
tao = "0.37"
tar = "0.4"
toml = "1"
toml_edit = "0.23"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.24"  # 0.25+ needs Rust 1.90; bump after `rustup update`
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
